<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Park Late Arrival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-first column, a pine header band with the logo, then a numbered arrival sequence, map, lockbox photo, plate form, good-to-know. */
:root{
  --pine:#2E4A3D; --pine-deep:#223A2F; --cream:#FAF5E6; --sand:#EFE6D2; --amber:#E0A23C; --amber-deep:#B9781F;
  --bg:#FAF5E6; --surface:#FFFDF6; --fg:#26261F; --muted:#6E6C5E; --line:#E3D9BF; --head-bg:#2E4A3D; --head-fg:#FAF5E6;
  --chip:#EFE6D2; --focus:#B9781F;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18221D; --surface:#203029; --fg:#EFEADB; --muted:#A9A792; --line:#33473D; --head-bg:#223A2F; --head-fg:#FAF5E6;
  --chip:#2B3D34; --amber:#E8AE4E; --amber-deep:#E8AE4E; --focus:#E8AE4E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18221D; --surface:#203029; --fg:#EFEADB; --muted:#A9A792; --line:#33473D; --head-bg:#223A2F; --head-fg:#FAF5E6;
  --chip:#2B3D34; --amber:#E8AE4E; --amber-deep:#E8AE4E; --focus:#E8AE4E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
header{background:var(--head-bg);color:var(--head-fg)}
header .wrap{padding-block:18px 26px;display:grid;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.langs{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:3px;border-radius:999px}
.langs button{font:600 13px/1 var(--f-body);letter-spacing:.06em;color:var(--head-fg);background:transparent;border:0;border-radius:999px;padding:8px 11px;cursor:pointer}
.langs button{display:inline-flex;align-items:center;gap:6px}
.langs svg{width:22px;height:15px;border-radius:2px;box-shadow:0 0 0 1px rgba(255,255,255,.35);flex:none}
.langs button[aria-pressed="true"]{background:var(--amber);color:#26261F}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:84px;height:84px;border-radius:50%;flex:none}
.eyebrow{font:600 12px/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:#EAD7AE}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,7vw,38px);line-height:1.05;margin:4px 0 0;text-wrap:balance}
.lead{margin:0;color:#E6E1CF;max-width:52ch}
main .wrap{padding-block:22px 40px;display:grid;gap:30px}
h2{font-family:var(--f-display);font-weight:700;font-size:22px;margin:0 0 10px;text-wrap:balance}
.call{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.call .num{font:600 26px/1.1 var(--f-display);letter-spacing:.02em;font-variant-numeric:tabular-nums;user-select:all}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px/1 var(--f-body);padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--fg);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#26261F}
.btn:focus-visible,.langs button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:0}
ol.steps li{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
ol.steps li:last-child{border-bottom:1px solid var(--line)}
.n{width:32px;height:32px;border-radius:50%;background:var(--pine);color:var(--cream);display:grid;place-items:center;font:700 15px/1 var(--f-display)}
:root[data-theme="dark"] .n{background:var(--amber);color:#26261F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .n{background:var(--amber);color:#26261F}}
.steps b{display:block;font-weight:600;margin-bottom:2px}
.steps p{margin:0;color:var(--muted)}
.steps a{color:var(--amber-deep);font-weight:600}
figure{margin:0}
.photo{position:relative;border-radius:14px;overflow:hidden;max-width:100%}
.photo img{display:block;width:100%}
.ring{position:absolute;left:54%;top:59%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%);border:4px solid var(--amber);border-radius:50%;box-shadow:0 0 0 4px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){.ring{animation:pulse 2.2s ease-in-out infinite}}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}
figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.note{background:var(--chip);border-radius:12px;padding:12px 14px;font-size:15px}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff;max-height:78vh}
.mapbox img{display:block;width:100%;max-width:none}
.mapbox.zoom img{width:220%}
.maptools{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:14px;font-weight:600;min-width:0}
input{font:500 16px var(--f-body);padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
#plate{text-transform:uppercase;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.msg{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px dashed var(--line);border-radius:9px;padding:10px 12px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 18px}
.fact{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:15px}
.fact span:first-child{color:var(--muted)}
.fact span:last-child{font-weight:600;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
ul.rules{margin:12px 0 0;padding-left:18px;color:var(--muted);font-size:15px;display:grid;gap:4px}
.sos{display:flex;align-items:center;gap:14px;margin-top:16px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.sosn{font:700 26px/1 var(--f-display);background:var(--pine);color:var(--amber);padding:10px 12px;border-radius:10px;font-variant-numeric:tabular-nums}
.sos div div{font-size:14px;color:var(--muted)}
.rules b{color:var(--fg);font-weight:600}
.note b,#traShop b,#traAlt b{font-weight:600}
#tra b{display:inline;margin:0}
footer{border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer .wrap{padding-block:18px 28px}
.toast{font-size:14px;color:var(--amber-deep);font-weight:600;min-height:1em}
.leaf{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.leaf button{flex:0 0 78%;max-width:300px;scroll-snap-align:start;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);cursor:zoom-in}
.leaf img{display:block;width:100%}
.lb{position:fixed;inset:0;background:rgba(10,16,13,.92);z-index:50;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 56px) 12px 24px}
.lb img{display:block;width:100%;max-width:820px;margin:0 auto;border-radius:6px}
.lb .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;background:var(--amber);color:#26261F;border:0;border-radius:999px;font:600 15px/1 var(--f-body);padding:11px 16px;cursor:pointer}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

let lang="en";
try{const s=localStorage.getItem("cp-lang");if(s&&T[s])lang=s;else{const n=(navigator.language||"").slice(0,2);if(n==="de")lang="de";else if(n==="cs"||n==="sk")lang="cs";}}catch(e){}
const $=id=>document.getElementById(id);
const PHONE="420777772455";
function msg(){const L=T[lang];return L.msgT($("plate").value.trim().toUpperCase(),$("name").value.trim(),$("people").value||"?",$("nights").value||"?")}
function upd(){const m=msg();$("msg").textContent=m;$("wa").href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(m);$("sms").href="sms:+"+PHONE+"?body="+encodeURIComponent(m)}
function render(){
  const L=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L[el.dataset.t];if(typeof v==="string")el.textContent=v});
  $("steps").innerHTML=L.steps.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${s[0]}</b><p>${s[1]}</p></div></li>`).join("");
  $("facts").innerHTML=L.facts.map(f=>`<div class="fact"><span>${f[0]}</span><span>${f[1]}</span></div>`).join("");
  $("rules").innerHTML=L.rules.map(r=>`<li>${r}</li>`).join("");
  $("tra").innerHTML=L.tra.map((s,i)=>`<li><span class="n">${i+1}</span><div><p style="color:var(--fg)">${s}</p></div></li>`).join("");
  ["traAlt","traTips","traShop","recNote","sosN"].forEach(k=>$(k).innerHTML=L[k]);
  $("zoomBtn").textContent=$("mapbox").classList.contains("zoom")?L.zoomOut:L.zoomIn;
  document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
  $("toast").textContent="";upd();
}
document.querySelectorAll(".langs button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.l;try{localStorage.setItem("cp-lang",lang)}catch(e){}render()}));
$("zoomBtn").addEventListener("click",()=>{$("mapbox").classList.toggle("zoom");render()});
["plate","name","people","nights"].forEach(i=>$(i).addEventListener("input",upd));
$("f").addEventListener("submit",e=>e.preventDefault());
$("copy").addEventListener("click",()=>{const m=msg();const ok=()=>$("toast").textContent=T[lang].copied;
  try{navigator.clipboard.writeText(m).then(ok).catch(sel)}catch(e){sel()}
  function sel(){const r=document.createRange();r.selectNodeContents($("msg"));const s=getSelection();s.removeAllRanges();s.addRange(r)}});
function closeLb(){$("lb").hidden=true;document.body.style.overflow=""}
$("lbx").addEventListener("click",closeLb);$("lb").addEventListener("click",e=>{if(e.target.id==="lb")closeLb()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLb()});
render();
</script>
